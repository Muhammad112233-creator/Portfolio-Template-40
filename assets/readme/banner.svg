<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Playmode Portfolio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5f6d"><animate attributeName="stop-color" values="#ff5f6d;#ffc371;#47e891;#5be0ff;#c8b6ff;#fea0c0;#ff5f6d" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#5be0ff"><animate attributeName="stop-color" values="#5be0ff;#c8b6ff;#fea0c0;#ff5f6d;#ffc371;#47e891;#5be0ff" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#fea0c0"><animate attributeName="stop-color" values="#fea0c0;#ff5f6d;#ffc371;#47e891;#5be0ff;#c8b6ff;#fea0c0" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c9d4f5" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle cx="1080" cy="60" r="34" fill="#f2c94c" opacity="0.9">
    <animate attributeName="r" values="34;38;34" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="60" r="22" fill="#070b16" opacity="0.35"/>
  <text x="60" y="120" font-family="Verdana, Geneva, sans-serif" font-size="64" font-weight="bold" fill="url(#rainbow)">PLAYMODE PORTFOLIO</text>
  <text x="60" y="165" font-family="Verdana, Geneva, sans-serif" font-size="22" fill="#c9d4f5">Wanted poster · 3D island voyage · Game HUD · Next.js + Three.js</text>
  <g font-family="Verdana, Geneva, sans-serif" font-size="16" fill="#fea0c0">
    <text x="60" y="225">PRESS START</text>
    <rect x="185" y="212" width="12" height="18" fill="#fea0c0"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="0" y="286" width="1200" height="4" fill="url(#rainbow)"/>
</svg>
